---
# Run on a host with internet access that has the same OS image as the air-gapped targets.
# The packages are downloaded to the host and then copied to the control node.
- name: Download IAG5 server and runner packages
  hosts: iag5_servers:iag5_runners
  become: true
  vars:
    gateway_offline_install_enabled: false
  roles:
    - role: itential.iag5.gateway
      tags: always
  tasks:
    - name: Download IAG5 server packages  # noqa run-once
      ansible.builtin.import_role:
        name: itential.iag5.gateway_server
        tasks_from: download-packages
      run_once: true

- name: Download IAG5 client packages
  hosts: iag5_clients
  become: true
  vars:
    gateway_offline_install_enabled: false
  roles:
    - role: itential.iag5.gateway
      tags: always
  tasks:
    - name: Download IAG5 client packages  # noqa run-once
      ansible.builtin.import_role:
        name: itential.iag5.gateway_client
        tasks_from: download-packages
      run_once: true
