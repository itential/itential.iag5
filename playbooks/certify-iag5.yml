---
# IAG5 Installation Certification
#
# Forensic read-only certification that IAG5 has been successfully installed
# across all node types. Checks service state, config file properties, TLS
# file existence and certificate details, runtime versions, log directories,
# and network connectivity. A markdown report is generated per host and
# fetched to the control node under ./certify_reports/.
#
# Can be run standalone after deployment:
#
#   ansible-playbook itential.iag5.certify-iag5 -i <inventory>
#
# Tag reference:
#   certify-iag5    — run both forensic + TLS certification
#   certify-install — run forensic installation certification only
#   certify         — run TLS certification only

# -----------------------------------------------------------------------
# PLAY 1 — Gateway server and runner nodes
# -----------------------------------------------------------------------
- name: "IAG5 server and runner installation certification"
  hosts: iag5_servers:iag5_runners
  become: true
  gather_facts: false
  tags: [certify-iag5]
  tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: [always]

    - name: Load gateway shared variables
      ansible.builtin.import_role:
        name: itential.iag5.gateway
      when: false
      tags: [always]

    - name: Run IAG5 server/runner installation certification
      ansible.builtin.include_role:
        name: itential.iag5.gateway_server
        tasks_from: certify-iag5.yml
        apply:
          tags: [certify-install]
      tags: [certify-install]

    - name: Run IAG5 server/runner TLS certification
      ansible.builtin.include_role:
        name: itential.iag5.gateway_server
        tasks_from: certify.yml
        apply:
          tags: [certify]
      tags: [certify]

# -----------------------------------------------------------------------
# PLAY 2 — Gateway client nodes
# -----------------------------------------------------------------------
- name: "IAG5 client installation certification"
  hosts: iag5_clients
  become: true
  gather_facts: false
  tags: [certify-iag5]
  tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: [always]

    - name: Load gateway shared variables
      ansible.builtin.import_role:
        name: itential.iag5.gateway
      when: false
      tags: [always]

    - name: Run IAG5 client installation certification
      ansible.builtin.include_role:
        name: itential.iag5.gateway_client
        tasks_from: certify-iag5.yml
        apply:
          tags: [certify-install]
      tags: [certify-install]

    - name: Run IAG5 client TLS certification
      ansible.builtin.include_role:
        name: itential.iag5.gateway_client
        tasks_from: certify.yml
        apply:
          tags: [certify]
      tags: [certify]
