---
- name: Configure Gateway Manager
  hosts: iag5_servers
  become: true
  roles:
    # Pull in the gateway vars
    - role: itential.iag5.gateway
      tags: always

  tasks:
    # Create the Gateway, upload its certificates and link them in Gateway Manager
    - name: Configure Gateway Manager
      ansible.builtin.include_role:
        name: itential.iag5.gateway_server
        tasks_from: configure_gateway_manager
      vars:
        gateway_application_mode: server
