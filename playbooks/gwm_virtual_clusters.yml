---
- name: Configure Gateway Manager virtual clusters
  hosts: iag5_servers
  gather_facts: false
  roles:
    # Pull in the gateway vars
    - role: itential.iag5.gateway
      tags: always

  tasks:
    # Create or update the virtual clusters. The Gateways must already exist in Gateway Manager.
    - name: Configure Gateway Manager virtual clusters
      ansible.builtin.include_role:
        name: itential.iag5.gateway_server
        tasks_from: configure_gateway_manager_virtual_clusters
      vars:
        gateway_application_mode: server
