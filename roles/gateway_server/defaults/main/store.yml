---
#########################
# Gateway store variables
#########################

# Gateway store backend (local, dynamodb, etcd)
gateway_server_store_backend: local

# Gateway Etcd variables
gateway_server_store_etcd_hosts: localhost:2379
gateway_server_store_etcd_use_tls: true
gateway_server_store_etcd_client_cert_auth: true

# Destination paths for the etcd certs on the target host, read by server.conf.j2/
# runner.conf.j2 whenever gateway_server_store_etcd_use_tls is true. Sourced from
# roles/gateway_server/defaults/main/pki.yml (gateway_server_pki_etcd_*_dest), which also
# defines where those files come from on the control node - see pki.yml for the source
# paths. Those source paths are always derived from gateway_pki_src_dir, the same as the
# main Gateway cert/key/CA, so the corresponding etcd-ca.crt/etcd-client.crt/etcd-client.key
# files must exist there whenever etcd TLS is enabled.
gateway_server_store_etcd_ca_certificate_filename: "{{ gateway_server_pki_etcd_ca_cert_dest }}"
gateway_server_store_etcd_certificate_filename: "{{ gateway_server_pki_etcd_cert_dest }}"
gateway_server_store_etcd_private_key_filename: "{{ gateway_server_pki_etcd_key_dest }}"

# Gateway DynamoDB variables
gateway_server_store_dynamodb_table_name: itential.gateway5.store
gateway_server_store_dynamodb_aws_access_key_id:
gateway_server_store_dynamodb_aws_secret_access_key:
gateway_server_store_dynamodb_aws_session_token:
gateway_server_store_dynamodb_aws_region:
