---
#########################
# Gateway store variables
#########################

# Gateway store backend (local, dynamodb, etcd)
gateway_server_store_backend: local

# Gateway Etcd variables
gateway_server_store_etcd_hosts: localhost:2379
gateway_server_store_etcd_use_tls: true
gateway_server_store_etcd_client_cert_auth: true

# Source paths on the control node for dedicated etcd TLS certs. Undefined by default -
# set these to have the role upload separate etcd certs instead of reusing the main
# Gateway PKI (see gateway_server_store_etcd_*_filename below).
gateway_server_store_etcd_ca_cert_src:
gateway_server_store_etcd_cert_src:
gateway_server_store_etcd_key_src:

# Where a dedicated etcd cert would live on the target host, if one is supplied above.
gateway_server_store_etcd_ca_certificate_filename_dedicated: "{{ gateway_server_pki_dir }}/etcd-ca{{ gateway_pki_cert_suffix }}"
gateway_server_store_etcd_certificate_filename_dedicated: "{{ gateway_server_pki_dir }}/etcd-client{{ gateway_pki_cert_suffix }}"
gateway_server_store_etcd_private_key_filename_dedicated: "{{ gateway_server_pki_dir }}/etcd-client{{ gateway_pki_key_suffix }}"

# Actual destination used: the dedicated path above when a matching *_src is set, otherwise
# the same file as the main Gateway PKI (today's default, unchanged for anyone not opting in
# to a separate etcd PKI).
gateway_server_store_etcd_ca_certificate_filename: "{{ gateway_server_store_etcd_ca_certificate_filename_dedicated
  if gateway_server_store_etcd_ca_cert_src is not none else gateway_server_pki_ca_cert_dest }}"
gateway_server_store_etcd_certificate_filename: "{{ gateway_server_store_etcd_certificate_filename_dedicated
  if gateway_server_store_etcd_cert_src is not none else gateway_server_pki_cert_dest }}"
gateway_server_store_etcd_private_key_filename: "{{ gateway_server_store_etcd_private_key_filename_dedicated
  if gateway_server_store_etcd_key_src is not none else gateway_server_pki_key_dest }}"

# Gateway DynamoDB variables
gateway_server_store_dynamodb_table_name: itential.gateway5.store
gateway_server_store_dynamodb_aws_access_key_id:
gateway_server_store_dynamodb_aws_secret_access_key:
gateway_server_store_dynamodb_aws_session_token:
gateway_server_store_dynamodb_aws_region:
