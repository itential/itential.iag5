---
# Loads the OS specific values from vars/os-el<major>.yml, falling back to vars/os-default.yml.
- name: Load the OS specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', gateway_server_os_vars_files) }}"
  vars:
    gateway_server_os_vars_files:
      - "os-el{{ ansible_distribution_major_version }}.yml"
      - os-default.yml
  tags: always
