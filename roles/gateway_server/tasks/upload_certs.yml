---
- name: Upload SSL-related files
  when: gateway_pki_upload | bool
  block:
    - name: Create the gateway server pki directory
      ansible.builtin.file:
        name: "{{ gateway_server_pki_dir }}"
        state: directory
        owner: "{{ gateway_server_user }}"
        group: "{{ gateway_server_group }}"
        mode: "0755"

    - name: Copy application CA certificate
      ansible.builtin.copy:
        src: "{{ gateway_server_pki_ca_cert_src }}"
        dest: "{{ gateway_server_pki_ca_cert_dest }}"
        owner: "{{ gateway_server_user }}"
        group: "{{ gateway_server_group }}"
        mode: "0444"
      when:
        - gateway_server_pki_ca_cert_src is defined
        - gateway_server_pki_ca_cert_src is not none

    - name: Copy Gateway server certificate
      ansible.builtin.copy:
        src: "{{ gateway_server_pki_cert_src }}"
        dest: "{{ gateway_server_pki_cert_dest }}"
        owner: "{{ gateway_server_user }}"
        group: "{{ gateway_server_group }}"
        mode: "0644"
      when:
        - gateway_server_pki_cert_src is defined
        - gateway_server_pki_cert_src is not none

    - name: Copy Gateway server private key
      ansible.builtin.copy:
        src: "{{ gateway_server_pki_key_src }}"
        dest: "{{ gateway_server_pki_key_dest }}"
        owner: "{{ gateway_server_user }}"
        group: "{{ gateway_server_group }}"
        mode: "0400"
      when:
        - gateway_server_pki_key_src is defined
        - gateway_server_pki_key_src is not none

    - name: Add the CA certificate to the OS trust store
      when:
        - gateway_server_connect_enabled | bool
        - gateway_server_pki_trust_ca_enabled | bool
        - gateway_server_pki_trust_ca_src is defined
        - gateway_server_pki_trust_ca_src is not none
      block:
        - name: Copy the CA certificate to the OS trust store directory
          ansible.builtin.copy:
            src: "{{ gateway_server_pki_trust_ca_src }}"
            dest: "{{ gateway_server_pki_trust_ca_dest }}"
            owner: root
            group: root
            mode: "0644"

        - name: Read the CA certificate in the OS trust store directory
          ansible.builtin.slurp:
            src: "{{ gateway_server_pki_trust_ca_dest }}"
          register: gateway_server_trust_ca_anchor

        - name: Read the OS trust bundle
          ansible.builtin.slurp:
            src: "{{ gateway_server_pki_trust_bundle }}"
          register: gateway_server_trust_bundle
          failed_when: false

        # Compares the certificates in the anchor file with the extracted bundle instead of relying on the
        # copy task result, so a previous run that copied the CA but did not rebuild the trust store is repaired
        - name: Check whether the CA certificate is missing from the OS trust bundle
          ansible.builtin.set_fact:
            gateway_server_trust_ca_missing: >-
              {{ gateway_server_trust_ca_anchor.content | b64decode
                 | regex_findall('(?s)-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----')
                 | map('regex_replace', '\\s', '')
                 | reject('in', gateway_server_trust_bundle.content | default('') | b64decode | regex_replace('\\s', ''))
                 | list | length > 0 }}

        - name: Update the OS trust store
          ansible.builtin.command: update-ca-trust
          changed_when: true
          when: gateway_server_trust_ca_missing | bool
          notify: Enable and start Gateway

    - name: Upload Gateway Manager certificate and key
      when: gateway_application_mode == 'server'
      block:
        - name: Copy Gateway Manager certificate and key
          when: gateway_server_connect_enabled | bool
          block:
            - name: Copy Gateway manager certificate
              ansible.builtin.copy:
                src: "{{ gateway_server_application_local_certs_dir }}/{{ gateway_server_connect_local_certificate_filename }}"
                dest: "{{ gateway_server_pki_dir }}/{{ gateway_server_connect_certificate_filename }}"
                owner: "{{ gateway_server_user }}"
                group: "{{ gateway_server_group }}"
                mode: "0644"
              when:
                - gateway_server_connect_local_certificate_filename is defined
                - gateway_server_connect_local_certificate_filename is not none

            - name: Copy Gateway manager private key
              ansible.builtin.copy:
                src: "{{ gateway_server_application_local_certs_dir }}/{{ gateway_server_connect_local_private_key_filename }}"
                dest: "{{ gateway_server_pki_dir }}/{{ gateway_server_connect_private_key_filename }}"
                owner: "{{ gateway_server_user }}"
                group: "{{ gateway_server_group }}"
                mode: "0400"
              when:
                - gateway_server_connect_local_private_key_filename is defined
                - gateway_server_connect_local_private_key_filename is not none

    - name: Upload etcd TLS certificates
      when:
        - gateway_server_store_backend == 'etcd'
        - gateway_server_store_etcd_use_tls | bool
      block:
        - name: Upload etcd CA certificate
          ansible.builtin.copy:
            src: "{{ gateway_server_pki_etcd_ca_cert_src }}"
            dest: "{{ gateway_server_pki_etcd_ca_cert_dest }}"
            owner: "{{ gateway_server_user }}"
            group: "{{ gateway_server_group }}"
            mode: "0444"
          when:
            - gateway_server_pki_etcd_ca_cert_src is defined
            - gateway_server_pki_etcd_ca_cert_src is not none

        - name: Upload etcd client certificate and key
          when: gateway_server_store_etcd_client_cert_auth | bool
          block:
            - name: Upload etcd client certificate
              ansible.builtin.copy:
                src: "{{ gateway_server_pki_etcd_cert_src }}"
                dest: "{{ gateway_server_pki_etcd_cert_dest }}"
                owner: "{{ gateway_server_user }}"
                group: "{{ gateway_server_group }}"
                mode: "0644"
              when:
                - gateway_server_pki_etcd_cert_src is defined
                - gateway_server_pki_etcd_cert_src is not none

            - name: Upload etcd client private key
              ansible.builtin.copy:
                src: "{{ gateway_server_pki_etcd_key_src }}"
                dest: "{{ gateway_server_pki_etcd_key_dest }}"
                owner: "{{ gateway_server_user }}"
                group: "{{ gateway_server_group }}"
                mode: "0400"
              when:
                - gateway_server_pki_etcd_key_src is defined
                - gateway_server_pki_etcd_key_src is not none
