---
# The SELinux policy labels /opt/gateway as usr_t, which systemd is allowed to execute. A relocated
# install directory gets the default_t label instead, so the service fails with exit status 203.
# Apply the same label to the relocated directory.
- name: Label the relocated install directory for SELinux
  when:
    - gateway_server_selinux_relabel | bool
    - gateway_server_install_dir != gateway_server_install_dir_default
    - ansible_facts.selinux.status | default('disabled') == 'enabled'
  block:
    - name: Install the SELinux policy management tools
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present

    - name: List the local SELinux file context rules
      ansible.builtin.command: semanage fcontext --list --locallist
      register: gateway_server_selinux_fcontexts
      changed_when: false

    - name: Add the SELinux file context rule for the install directory
      ansible.builtin.command: >-
        semanage fcontext --add --type usr_t '{{ gateway_server_install_dir }}(/.*)?'
      when: gateway_server_selinux_fcontexts.stdout is not search(gateway_server_install_dir | regex_escape)
      changed_when: true

    - name: Apply the SELinux file context to the install directory
      ansible.builtin.command: restorecon -R -v {{ gateway_server_install_dir }}
      register: gateway_server_selinux_restorecon
      changed_when: gateway_server_selinux_restorecon.stdout | length > 0
