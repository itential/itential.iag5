---
- name: Validate Gateway variables
  tags: always
  block:
    - name: Validate gateway_server_packages is set
      ansible.builtin.assert:
        that:
          - gateway_server_packages is defined
          - gateway_server_packages is iterable
          - gateway_server_packages | length > 0
        fail_msg: gateway_server_packages must be defined

    - name: Validate gateway_secrets_encrypt_key is correctly formatted
      ansible.builtin.assert:
        that:
          - gateway_secrets_encrypt_key is match('^[0-9a-fA-F]+$')
          - gateway_secrets_encrypt_key | length == 64
        fail_msg: gateway_secrets_encrypt_key must be a 64 character hexadecimal string

    - name: Validate offline packages exist on the control node
      when: gateway_offline_install_enabled | bool
      block:
        - name: Validate the Gateway version can be determined from gateway_server_packages
          ansible.builtin.assert:
            that:
              - gateway_server_packages is defined
              - gateway_server_packages is iterable
              - gateway_server_packages | length > 0
              - gateway_server_packages | map('basename') | map('regex_search', gateway_offline_version_regex) | select('none') | list | length == 0
              - gateway_server_packages | map('basename') | map('regex_findall', gateway_offline_version_regex) | map('first') | unique | list | length == 1
            fail_msg:
              - "The Gateway version could not be determined from gateway_server_packages when gateway_offline_install_enabled is set to 'true'"
              - "Every package file name must contain exactly one version (for example iagctl-v5.5.3-linux-amd64-server.rpm), and all packages must have the same version"

        - name: Validate gateway_offline_control_node_root is set
          ansible.builtin.assert:
            that:
              - gateway_offline_control_node_root is defined
              - gateway_offline_control_node_root is not none
              - gateway_offline_control_node_root | string | length > 0
            fail_msg: gateway_offline_control_node_root must be defined when gateway_offline_install_enabled is set to 'true'

        - name: Get status of the gateway_offline_control_node_root
          ansible.builtin.stat:
            path: "{{ gateway_offline_control_node_root }}"
            follow: true
          register: gateway_server_offline_control_node_path_status
          delegate_to: localhost
          become: false

        - name: Validate gateway_offline_control_node_root is a directory
          ansible.builtin.assert:
            that:
              - gateway_server_offline_control_node_path_status.stat.exists
              - gateway_server_offline_control_node_path_status.stat.isdir
            fail_msg: "gateway_offline_control_node_root {{ gateway_offline_control_node_root }} is not a valid directory on the control node"

        - name: Find the offline RPMs on the control node
          ansible.builtin.find:
            paths: "{{ gateway_offline_control_node_rpms_dir }}/{{ item.dir }}"
            patterns: "*.rpm"
          register: gateway_server_offline_rpms_result
          delegate_to: localhost
          become: false
          loop: "{{ gateway_server_offline_required_rpm_dirs }}"
          loop_control:
            label: "{{ item.dir }}"
          vars:
            gateway_server_offline_required_rpm_dirs: "{{ [{'dir': 'gateway'}]
              + ([{'dir': 'python'}] if gateway_server_features_python_enabled | bool else [])
              + ([{'dir': 'opentofu'}] if gateway_server_features_opentofu_enabled | bool else [])
              + ([{'dir': 'selinux'}] if gateway_server_selinux_packages_required | bool else []) }}"

        - name: Validate the offline RPMs exist on the control node
          ansible.builtin.assert:
            that: item.matched > 0
            fail_msg: "No RPMs found in offline directory {{ gateway_offline_control_node_rpms_dir }}/{{ item.item.dir }}. Run the download_packages playbook and copy the packages to the control node."
          loop: "{{ gateway_server_offline_rpms_result.results }}"
          loop_control:
            label: "{{ item.item.dir }}"

    - name: Validate variables when uploading is configured on
      when: gateway_pki_upload | bool
      block:
        - name: Validate gateway_pki_src_dir variable is set
          ansible.builtin.assert:
            that:
              - gateway_pki_src_dir is defined
              - gateway_pki_src_dir is not none
            fail_msg: gateway_pki_src_dir must be defined when gateway_pki_upload is set to 'true'

        - name: Stat gateway_pki_src_dir directory
          ansible.builtin.stat:
            path: "{{ gateway_pki_src_dir }}"
          register: gateway_server_pki_dir_stat_result
          delegate_to: localhost
          become: false

        - name: Validate gateway_pki_src_dir exists
          ansible.builtin.assert:
            that: gateway_server_pki_dir_stat_result.stat.exists
            fail_msg:
              - "Local pki directory {{ gateway_pki_src_dir }} does not exist"
              - "Set gateway_pki_src_dir to a valid directory"
