---
# Must stay above "Enable and start Gateway" so the trust store is rebuilt before the gateway restarts
- name: Update OS trust store
  ansible.builtin.command: update-ca-trust
  changed_when: true

- name: Enable and start Gateway
  ansible.builtin.systemd:
    name: iagctl
    enabled: true
    state: restarted
    daemon_reload: true
  register: iagctl_service_result
  until: iagctl_service_result.status.ActiveState == "active"
  retries: 4
  delay: 5
  failed_when: iagctl_service_result.status.ActiveState != "active"
