---
# TLS certificate verification for gateway client nodes.
# Called via: include_role: name: itential.iag5.gateway_client tasks_from: certify.yml
# Requires: itential.iag5.gateway role to have been loaded (provides gateway_* vars).

- name: "Set verification context"
  ansible.builtin.set_fact:
    node_section: "client"
    gateway_conf: "{{ gateway_client_working_dir }}/gateway.conf"
    server_port: "{{ gateway_client_port }}"
    service_name: iagctl
    iag5_server_group: iag5_servers
    iag5_client_group: iag5_clients
    private_ip: "{{ ansible_default_ipv4.address | default(ansible_host) }}"
    certify_report_file: "/tmp/certify_{{ inventory_hostname }}.md"
    certify_report_dir_local: "./certify_reports"
    certify_report_template: "{{ role_path }}/../certify_common/templates/certify-report.md.j2"
    report_file_owner: "{{ gateway_client_user }}"
    report_file_group: "{{ gateway_client_group }}"
    check_results: []

# -----------------------------------------------------------------------
# SUITE 1 — Cluster TLS: CLIENT ↔ SERVER (gRPC mTLS) — client side
# -----------------------------------------------------------------------

- name: "SUITE 1 | Run cluster client↔server checks (client side)"
  ansible.builtin.include_tasks: ../../certify_common/tasks/certify_cluster_client_to_server.yml

- name: "SUITE 1 | Print summary"
  ansible.builtin.include_tasks: ../../certify_common/tasks/summary.yml
  vars:
    role_title: "CLUSTER TLS — CLIENT ↔ SERVER (gRPC mTLS) — CLIENT NODE"
