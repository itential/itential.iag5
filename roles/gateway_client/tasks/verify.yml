---
- name: Verify OS compatibility
  ansible.builtin.include_role:
    name: itential.iag5.verify_common
    tasks_from: verify-os.yml

# gateway_client_packages can be a local artifact path or an https:// URL. When it's a URL it's
# usually the Itential registry (the same fixed public endpoint gateway_server always checks),
# though it can also point to a customer-supplied Nexus/JFrog/GitLab host -- there's no generic
# way to verify reachability of a customer-specific URL, but the fixed Itential endpoint is
# always worth checking.
- name: Verify connectivity to required public repositories
  ansible.builtin.include_role:
    name: itential.iag5.verify_common
    tasks_from: verify-connectivity.yml
  vars:
    required_repositories: "{{ gateway_client_required_repositories }}"

- name: Verify proxy configuration
  ansible.builtin.include_role:
    name: itential.iag5.verify_common
    tasks_from: verify-proxy.yml

- name: Verify TLS source files
  when: gateway_pki_upload | bool
  ansible.builtin.include_role:
    name: itential.iag5.verify_common
    tasks_from: verify-tls-files.yml
  vars:
    pki_cert_src: "{{ gateway_client_pki_cert_src }}"
    pki_key_src: "{{ gateway_client_pki_key_src }}"
    pki_ca_cert_src: "{{ gateway_client_pki_ca_cert_src }}"
    check_san: false

- name: Report verification results
  ansible.builtin.include_role:
    name: itential.iag5.verify_common
    tasks_from: verify-results.yml
  vars:
    component_name: "Client"
