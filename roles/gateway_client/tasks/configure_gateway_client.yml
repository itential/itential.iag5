---
- name: Create the gateway configuration file
  ansible.builtin.template:
    src: "gateway.conf.j2"
    dest: "{{ gateway_client_working_dir }}/gateway.conf"
    mode: "0600"
    owner: "{{ gateway_client_user }}"
    group: "{{ gateway_client_group }}"
    lstrip_blocks: true
    backup: true

- name: Create the gateway encryption key file
  ansible.builtin.copy:
    content: "{{ gateway_secrets_encrypt_key }}"
    dest: "{{ gateway_secrets_encrypt_key_file }}"
    mode: "0600"
    owner: "{{ gateway_client_user }}"
    group: "{{ gateway_client_group }}"

- name: Configure gateway environment variables in .bash_profile
  ansible.builtin.blockinfile:
    path: "/home/{{ gateway_client_user }}/.bash_profile"
    create: true
    owner: "{{ gateway_client_user }}"
    group: "{{ gateway_client_group }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - gateway"
    block: |
      export GATEWAY_CONFIG={{ gateway_client_working_dir }}/gateway.conf
      export PATH=$PATH:{{ gateway_client_install_dir }}
